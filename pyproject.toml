[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroflux"
version = "2.0.0"
description = "Browser-based MRI segmentation pipeline powered by SynthSeg 2.0 (bundled)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mri", "segmentation", "neuroimaging", "synthseg", "brain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "flask>=2.3,<4",
    "flask-cors>=4.0",
    "nibabel>=5.0",
    "numpy>=1.24,<2.0",
    "scipy>=1.10",
    "scikit-image>=0.19",
    "trimesh>=4.0",
    "pydicom>=2.4",
    "dicom2nifti>=2.4",
    # SynthSeg 2.0 is now bundled — these were previously in the separate synthseg_env
    "tensorflow==2.15.*",
    "h5py>=3.8",
    "matplotlib>=3.7",
    "protobuf>=4.21,<5",
]

[project.scripts]
neuroflux-server  = "neuroflux.server:main"
neuroflux-segment = "neuroflux.segment:main"
neuroflux-setup   = "neuroflux.setup_synthseg:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"neuroflux.data" = ["*.html", "*.nii", "*.nii.gz"]
"neuroflux.synthseg.data.labels_classes_priors" = ["*.npy"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Apple Silicon GPU acceleration
metal = ["tensorflow-metal>=1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
