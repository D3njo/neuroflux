name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Fast tests (no TensorFlow) ───────────────────────────────────────────────
  # Tests that don't need TF: labels, server, synthseg package structure.
  # Runs on all platforms and Python 3.10-3.12.
  test-fast:
    name: Fast tests / ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project (no TF — dev only)
        # Install without TF by overriding the conditional dep.
        # We do this by installing dependencies from pyproject.toml but
        # excluding the tensorflow line for the fast test suite.
        run: |
          pip install --upgrade pip
          pip install "nibabel>=5.0" "numpy>=1.24,<2.0" "scipy>=1.10" \
                      "h5py>=3.8" "matplotlib>=3.7" "protobuf>=4.21,<5" \
                      "flask>=2.3,<4" "flask-cors>=4.0" \
                      "scikit-image>=0.19" "trimesh>=4.0" \
                      "pydicom>=2.4" "dicom2nifti>=2.4" \
                      "pytest>=8"
          pip install -e . --no-deps

      - name: Run fast tests (skip TF-backed tests)
        run: python -m pytest tests/ -v --tb=short -m "not slow"

  # ── TF-backed import tests ────────────────────────────────────────────────────
  # Verifies that SynthSeg modules import correctly under TF 2.15.
  # TF 2.15 supports Python 3.9-3.11 only.
  # Runs on ubuntu + macos-14 (Apple Silicon) — no Windows for TF tests
  # because TF wheel sizes make Windows CI very slow.
  test-tf:
    name: TF import tests / ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip wheels
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-tf215-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-tf215-${{ matrix.python-version }}-

      - name: Install project + TensorFlow
        run: pip install -e ".[dev]"

      - name: Run TF-backed import tests (skip inference — no model weights in CI)
        run: >
          python -m pytest tests/test_synthseg_import.py -v --tb=short -m slow
          -k "not TestSynthSegInference"
