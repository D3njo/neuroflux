name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Lint (ruff) ──────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install "ruff>=0.4"

      - name: Run ruff check
        run: ruff check src/ tests/

  # ── Fast tests (no TensorFlow) ───────────────────────────────────────────────
  # Tests that don't need TF: labels, server, synthseg package structure.
  # Runs on all platforms and Python 3.10-3.12.
  test-fast:
    name: Fast tests / ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project (no TF)
        # shell: bash ensures \ line continuation works on Windows too
        shell: bash
        run: |
          pip install --upgrade pip
          pip install \
            "nibabel>=5.0" "numpy>=1.24,<2.0" "scipy>=1.10" \
            "h5py>=3.8" "matplotlib>=3.7" "protobuf>=4.21,<5" \
            "flask>=2.3,<4" "flask-cors>=4.0" \
            "scikit-image>=0.19" "trimesh>=4.0" \
            "pydicom>=2.4" "dicom2nifti>=2.4" \
            "pytest>=8" "pytest-timeout>=2.3"
          pip install -e . --no-deps

      - name: Run fast tests (skip TF-backed tests)
        run: python -m pytest tests/ -v --tb=short -m "not slow"

  # ── TF-backed import tests ────────────────────────────────────────────────────
  # Verifies that SynthSeg modules import correctly under TF 2.18 + Keras 3.
  # ubuntu + macos-14 (Apple Silicon arm64); Windows excluded (TF wheels are slow to install).
  test-tf:
    name: TF import tests / ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip wheels
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-tf218-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-tf218-${{ matrix.python-version }}-

      - name: Install project + TensorFlow
        run: pip install -e ".[dev]"

      - name: Run TF-backed import tests (skip inference — no model weights in CI)
        run: >
          python -m pytest tests/test_synthseg_import.py -v --tb=short -m slow
          -k "not TestSynthSegInference"

  # ── Inference smoke-test with cached model weights ────────────────────────────
  # Downloads model weights once and caches them.  Runs the full end-to-end
  # pipeline on a synthetic NIfTI volume (CPU, fast mode, --threads 1).
  # Only runs on ubuntu-latest to keep costs low — the inference path is
  # platform-independent, so one platform is sufficient for a smoke test.
  test-inference:
    name: Inference smoke-test / ubuntu / Python 3.12
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip wheels (TF 2.18)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ubuntu-pip-tf218-3.12-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ubuntu-pip-tf218-3.12-

      - name: Install project + TensorFlow
        run: pip install -e ".[dev]"

      - name: Cache SynthSeg model weights
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models/
          # Key based on the list of expected model files — bump to re-download
          key: synthseg-models-${{ hashFiles('src/neuroflux/setup_synthseg.py') }}

      - name: Download model weights (cache miss only)
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: python -m neuroflux.setup_synthseg

      - name: Run inference smoke-test
        run: >
          python -m pytest tests/test_synthseg_import.py::TestSynthSegInference
          -v --tb=short -m slow
          --timeout=600
